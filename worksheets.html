<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Worksheets | IBDP Math</title>
<meta name="description" content="Free original IB DP Mathematics worksheets with full worked solutions for AA and AI, SL and HL.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 34 34'%3E%3Crect width='34' height='34' rx='7' fill='%2310203A'/%3E%3Cpath d='M8 24C13 24 14 10 19 10S25 20 28 18' fill='none' stroke='%23FF6B6B' stroke-width='3'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,600;7..72,700&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/style.css">
<script>window.MathJax={tex:{inlineMath:[["\\(","\\)"]]},chtml:{scale:1}};</script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body>
<header class="site-header" id="header"></header>
<main>

<section class="page-head"><div class="wrap"><div class="inner">
  <h1>Worksheets</h1>
  <p>Download a worksheet, attempt it, then check every step against the worked solutions.</p>
</div></div></section>
<section class="section" style="padding-top:48px">
  <div class="wrap">
    <div class="toolbar">
      <input type="search" id="q" placeholder="Search by title or topic" aria-label="Search worksheets">
      <select id="course" aria-label="Course"><option value="">All courses</option><option>AA SL</option><option>AA HL</option><option>AI SL</option><option>AI HL</option></select>
      <select id="topic" aria-label="Topic"><option value="">All topics</option><option>Number and algebra</option><option>Functions</option><option>Geometry and trigonometry</option><option>Statistics and probability</option><option>Calculus</option></select>
    </div>
    <p class="result-count" id="count" aria-live="polite"></p>
    <div class="ws-list" id="list"></div>
  </div>
</section>

</main>
<footer class="site-footer" id="footer"></footer>
<script src="assets/worksheets.js"></script>
<script src="assets/site.js"></script>
<script src="assets/list.js"></script>
<script>
const q=document.getElementById("q"),c=document.getElementById("course"),t=document.getElementById("topic");
c.value=new URLSearchParams(location.search).get("course")||"";
function update(){
  const s=q.value.trim().toLowerCase();
  const items=WORKSHEETS.filter(w=>(!c.value||w.course===c.value)&&(!t.value||w.topic===t.value)&&(!s||(w.title+" "+w.topic).toLowerCase().includes(s)));
  document.getElementById("count").textContent=`Showing ${items.length} of ${WORKSHEETS.length} worksheet${WORKSHEETS.length===1?"":"s"}`;
  renderList(document.getElementById("list"),items);
}
[q,c,t].forEach(el=>el.addEventListener("input",update));update();
</script>
</body>
</html>
